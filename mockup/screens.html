<style>
/* Layout: a wall of phone screens on a dark board, each labelled; single deliberate dark look. */
:root {
  color-scheme: dark;
  --board: #111113; --bezel: #26262A; --label: #6E6E74;
  --bg: #000000; --ink: #F2F2EF; --dim: #8C8C91; --faint: #3B3B40; --line: #1D1D21; --raise: #0C0C0E;
  --amber: #F5A524; --red: #FF5A4E;
  --sans: "Geist", "Inter Tight", system-ui, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--board); color: var(--ink); }
body { font-family: var(--sans); }
.board {
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 48px 40px;
}
figure { margin: 0; display: grid; gap: 12px; width: 375px; max-width: 100%; }
figcaption { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--label); }
.phone {
  width: 100%; height: 812px; border-radius: 46px; border: 9px solid var(--bezel); background: var(--bg);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}

/* shared screen parts */
.sb { display: flex; justify-content: space-between; padding: 16px 28px 8px; font: 500 13px var(--mono); flex: none; }
.sb span:last-child { color: var(--dim); letter-spacing: .1em; }
.scr { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.pad { padding: 0 22px; }
.meta { font: 400 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.meta b { color: var(--ink); font-weight: 500; }
.hr { height: 1px; background: var(--line); margin: 0; border: 0; }
.sec { padding: 18px 22px; display: grid; gap: 14px; border-top: 1px solid var(--line); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; }
.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.giant { font: 300 104px/0.9 var(--sans); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.giant small { font-size: 26px; letter-spacing: 0; color: var(--dim); margin-left: 6px; font-weight: 400; }
.big { font: 300 44px/1 var(--sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.sub { font-size: 14px; color: var(--dim); }
.sub b { color: var(--ink); font-weight: 500; }
.btn { display: flex; justify-content: space-between; align-items: center; height: 58px; padding: 0 20px; background: var(--ink); color: var(--bg); font: 500 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; border-radius: 2px; }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--faint); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.grid2 > div { padding: 16px 22px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.grid2 > div:nth-child(odd) { border-right: 1px solid var(--line); }
.kv { font: 400 22px/1 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kv span { color: var(--dim); font-size: 14px; }
.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row:first-child { border-top: 0; padding-top: 0; }
.row .meta { white-space: nowrap; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding: 0 8px 26px; background: var(--bg); }
.tabs span { font: 500 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); text-align: center; padding-top: 14px; border-top: 2px solid transparent; margin-top: -1px; }
.tabs span.on { color: var(--ink); border-top-color: var(--ink); }
.box { width: 14px; height: 14px; border: 1px solid var(--dim); flex: none; margin-top: 3px; display: grid; place-items: center; }
.box.on { background: var(--ink); border-color: var(--ink); }
.box.on::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid var(--bg); border-bottom: 1.5px solid var(--bg); transform: rotate(-45deg) translate(1px,-1px); }
.chk { display: flex; gap: 12px; font-size: 14px; line-height: 1.45; }
.chk.done { color: var(--faint); text-decoration: line-through; }

/* 24h band */
.band { position: relative; height: 36px; background: var(--ink); }
.band .gap { position: absolute; top: 0; bottom: 0; background: var(--amber); }
.band .fut { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(90deg, var(--faint) 0 1px, transparent 1px 5px); background-color: var(--bg); border: 1px solid var(--faint); border-left: 0; }
.band .now { position: absolute; top: -8px; bottom: -8px; width: 1px; background: var(--ink); }
.band .now::before { content: ""; position: absolute; top: 0; left: -3px; width: 7px; height: 7px; background: var(--ink); }
.band-tags { position: relative; height: 14px; }
.band-tags span, .axis span { position: absolute; transform: translateX(-50%); font: 400 9.5px var(--mono); letter-spacing: .06em; color: var(--dim); white-space: nowrap; }
.band-tags span { color: var(--amber); }
.axis { position: relative; height: 12px; }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }

/* week */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; position: relative; }
.week .goal { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--faint); }
.week .goal span { position: absolute; right: 0; top: -14px; font: 400 9.5px var(--mono); color: var(--dim); }
.week .c { display: grid; gap: 4px; justify-items: center; align-self: end; z-index: 1; }
.week i { display: block; width: 100%; background: var(--ink); }
.week .c.t i { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 5px); outline: 1px solid var(--ink); outline-offset: -1px; }
.week .c em { font: normal 400 9.5px var(--mono); color: var(--dim); }
.week-x { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font: 400 9.5px var(--mono); color: var(--dim); text-align: center; letter-spacing: .08em; }

/* out state */
.notif { margin: 4px 10px 10px; background: #1A1A1D; border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; }
.notif .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 600 15px var(--mono); }
.notif b { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.notif b span { color: var(--dim); font-weight: 400; }
.notif p { margin: 2px 0 0; font-size: 13px; color: var(--dim); line-height: 1.35; }
.amber { color: var(--amber); }
.budget { display: flex; height: 10px; gap: 2px; }
.budget i { display: block; height: 100%; }
.seg3 { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--faint); }
.seg3 span { font: 500 10.5px var(--mono); letter-spacing: .1em; text-align: center; padding: 11px 0; color: var(--dim); border-left: 1px solid var(--faint); }
.seg3 span:first-child { border-left: 0; }
.seg3 span.on { background: var(--ink); color: var(--bg); }

/* trays */
.ticks { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 54px; }
.ticks i { display: block; height: 26px; background: var(--faint); }
.ticks i.d { background: var(--ink); }
.ticks i.c { height: 54px; background: var(--ink); }
.tt { display: grid; grid-template-columns: 34px 92px 44px minmax(0,1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.tt.cur { color: var(--ink); }
.tt.fut { color: var(--faint); }
.tt .note { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* photos */
.cmp { position: relative; aspect-ratio: 4/3; max-width: 100%; overflow: hidden; background: #111; }
.cmp .l { position: absolute; inset: 0; filter: grayscale(1) contrast(1.08) brightness(.92); }
.cmp .l svg { width: 100%; height: 100%; display: block; }
.cmp .r { clip-path: inset(0 0 0 58%); }
.cmp .split { position: absolute; top: 0; bottom: 0; left: 58%; width: 1px; background: var(--ink); }
.cmp .split::after { content: ""; position: absolute; top: 50%; left: -14px; width: 28px; height: 28px; border: 1px solid var(--ink); background: var(--bg); transform: translateY(-50%); }
.cmp .tag { position: absolute; bottom: 10px; font: 500 10px var(--mono); letter-spacing: .1em; background: var(--bg); padding: 4px 7px; }
.frames { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.fr { aspect-ratio: 3/4; max-width: 100%; position: relative; overflow: hidden; border: 1px solid var(--faint); }
.fr .l { position: absolute; inset: 0; filter: grayscale(1) contrast(1.08) brightness(.92); }
.fr .l svg { width: 100%; height: 100%; display: block; }
.fr.empty { display: grid; place-items: center; background:
  linear-gradient(var(--faint), var(--faint)) center/1px 26px no-repeat,
  linear-gradient(var(--faint), var(--faint)) center/26px 1px no-repeat; }
.fr.empty::before, .fr.empty::after { content: ""; position: absolute; width: 12px; height: 12px; border-color: var(--dim); border-style: solid; }
.fr.empty::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.fr.empty::after { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.fr .cap { position: absolute; left: 6px; bottom: 6px; font: 500 9.5px var(--mono); letter-spacing: .1em; background: var(--bg); padding: 3px 5px; }
.fr.empty .cap { left: 50%; bottom: 10px; transform: translateX(-50%); background: none; color: var(--dim); }

/* dentist */
.sev { display: grid; grid-template-columns: repeat(5, 8px); gap: 2px; }
.sev i { height: 12px; background: var(--faint); }
.sev i.on { background: var(--amber); }
.sev.hi i.on { background: var(--red); }
.tl { display: grid; grid-template-columns: 12px minmax(0,1fr); gap: 0 14px; }
.tl .rail { position: relative; }
.tl .rail::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: -6px; width: 1px; background: var(--faint); }
.tl .rail::after { content: ""; position: absolute; left: 1px; top: 4px; width: 9px; height: 9px; background: var(--ink); }
.tl .rail.next::after { background: var(--bg); border: 1px solid var(--ink); }
.tl .rail.last::before { display: none; }
.tl .body { padding-bottom: 18px; display: grid; gap: 4px; font-size: 14px; line-height: 1.45; }

/* settings */
.set { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; font-size: 14px; }
.set:first-child { border-top: 0; padding-top: 0; }
.set small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.val { font: 400 13px var(--mono); }
.sw { font: 500 10px var(--mono); letter-spacing: .1em; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--faint); }
.sw span { padding: 5px 8px; color: var(--faint); }
.sw span.on { background: var(--ink); color: var(--bg); }

@media (max-width: 420px) { .phone { height: 760px; border-width: 6px; border-radius: 36px; } .board { gap: 36px; } }
</style>

<script>
(function () {
  // last 7 days (hours worn), scale 20h–24h, today is projected
  const wk = [22.5, 22.6, 23.1, 22.4, 22.9, 23.3, 22.9], H = 70, y = v => (v - 20) / 4 * H;
  const week = document.getElementById("week");
  week.innerHTML = `<div class="goal" style="bottom:${y(22) + 16}px"><span>22h</span></div>` +
    wk.map((v, i) => `<div class="c ${i === 6 ? "t" : ""}"><em>${v.toFixed(1)}</em><i style="height:${y(v)}px"></i></div>`).join("");

  const ticks = document.getElementById("ticks");
  ticks.innerHTML = Array.from({ length: 24 }, (_, i) => `<i class="${i === 0 ? "d" : i === 1 ? "c" : ""}"></i>`).join("");

  // stand-in photos of teeth; crook = how misaligned
  function teeth(crook, view) {
    const skew = view === "left" ? -14 : view === "right" ? 14 : 0;
    const w = [20, 24, 26, 34, 34, 26, 24, 20], rot = [-6, 4, -9, 5, -4, 8, -3, 6], dy = [2, -3, 4, -1, 2, -4, 3, -2];
    let x = 160 - w.reduce((a, b) => a + b, 0) / 2, up = "", lo = "";
    w.forEach((ww, i) => {
      const h = 46 - Math.abs(i - 3.5) * 3.5;
      up += `<rect x="${x + 1}" y="${112 - h + dy[i] * crook / 3}" width="${ww - 2}" height="${h}" rx="6" fill="#F4F0E8" stroke="#CFC7B8" transform="rotate(${rot[i] * crook / 3} ${x + ww / 2} 112)"/>`;
      lo += `<rect x="${x + 3}" y="${118 - dy[7 - i] * crook / 4}" width="${ww - 6}" height="${h - 10}" rx="6" fill="#ECE6DA" stroke="#C9BFAE" transform="rotate(${-rot[7 - i] * crook / 4} ${x + ww / 2} 118)"/>`;
      x += ww;
    });
    return `<svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="320" height="240" fill="#B98070"/>
      <g transform="translate(${skew * 2} 0) skewX(${skew})"><path d="M40 112 Q160 18 280 112 Q160 214 40 112Z" fill="#6E2A2E"/>
      <path d="M58 112 Q160 50 262 112 Q160 176 58 112Z" fill="#3A1418"/>
      <path d="M66 106 Q160 62 254 106 L254 112 L66 112Z" fill="#C86A6C"/><path d="M66 120 Q160 160 254 120 L254 118 L66 118Z" fill="#C86A6C"/>
      ${up}${lo}<path d="M40 112 Q160 18 280 112 Q160 40 40 112Z" fill="#A9645C"/><path d="M40 112 Q160 214 280 112 Q160 190 40 112Z" fill="#A9645C"/></g></svg>`;
  }
  document.querySelectorAll("[data-teeth]").forEach(el => { el.innerHTML = teeth(parseFloat(el.dataset.teeth), el.dataset.view || "front"); });
})();
</script>
